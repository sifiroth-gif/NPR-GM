name: Qwen official tokenizer preflight (legacy, prefetch, optional, literary)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tokenizer-preflight.yml']
permissions:
  contents: read
jobs:
  tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'transformers==5.13.0' 'jinja2==3.1.6'
      - run: python -m npr_gm.tokenizer_preflight
