name: Research harness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m npr_gm.evaluate --check-data
      - run: python -m npr_gm.evaluate --fixture --output runs/fixture.jsonl
      - run: python -m npr_gm.knowledge
      - run: python -m npr_gm.hardware
      - run: python -m npr_gm.structured --check-drafts
